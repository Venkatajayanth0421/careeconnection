# Server Port
server.port=8080

# Application Name
spring.application.name=career-connect-backend

# ========================================================
# MySQL Database Configuration
# ========================================================
# Change username/password if your local MySQL settings differ
spring.datasource.url=jdbc:mysql://localhost:3306/job_portal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# Hibernate & JPA Configuration
# ========================================================
# Automatically creates or updates table schema based on entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open In View
spring.jpa.open-in-view=true
